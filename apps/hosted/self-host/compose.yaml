name: executor-next-hosted

services:
  server:
    build:
      context: ../../..
      dockerfile: apps/hosted/self-host/Dockerfile
      args:
        # Required. Set it in the environment or pass --build-arg.
        - EXECUTOR_BUILD_VERSION
    environment:
      BETTER_AUTH_URL:
      BETTER_AUTH_SECRET:
      RAILWAY_PUBLIC_DOMAIN:
      SSO_DISCOVERY_URL: ${SSO_DISCOVERY_URL:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_ALLOWED_DOMAINS: ${SSO_ALLOWED_DOMAINS:-}
      EXECUTOR_ENCRYPTION_KEY:
      # Optional operator-owned feedback receiver, independent of anonymous analytics.
      EXECUTOR_FEEDBACK_WEBHOOK_URL:
      EXECUTOR_FEEDBACK_WEBHOOK_SECRET:
      # Optional override of X-Forwarded-For for client-IP assertions from trusted peers.
      # Requires EXECUTOR_TRUSTED_PROXIES; see README "Rate limits behind a proxy".
      EXECUTOR_TRUSTED_PROXY_HEADER:
      # OAuth transport exceptions are explicit and parsed at startup.
      EXECUTOR_URL_ALLOW_LOOPBACK_HTTP:
      # JSON array of exact HTTP(S) origins allowed to resolve to private addresses.
      EXECUTOR_URL_ALLOW_HTTP_ORIGINS:
      EXECUTOR_APPS_ALLOW_PRIVATE_FETCH:
      # Comma-separated addresses of reverse proxies in front of the host; a CIDR range only if it
      # holds proxies and nothing else. Requests from them take the client's address, which rate
      # limits count, from X-Forwarded-For, so anything at a listed address can choose its own.
      # A proxy on this host connects from this network's gateway (`docker inspect`, Gateway).
      EXECUTOR_TRUSTED_PROXIES:
      # Most app and data Workers kept loaded (default 64). Idle ones above it unload and reload
      # on their next call. An app with a database runs its calls in a data Worker, which counts.
      EXECUTOR_APP_WORKERS:
      # Seconds a Worker stays loaded without a call (default 300); 0 keeps idle ones until the limit.
      EXECUTOR_APP_WORKER_IDLE_SECONDS:
      EXECUTOR_OAUTH_CALLBACK_URL:
      # Off by default. <BETTER_AUTH_URL>/oauth/client-metadata.json serves a client metadata
      # document there, which authorization servers must be able to fetch over public HTTPS.
      EXECUTOR_OAUTH_CLIENT_METADATA_URL:
      # The official app feed's index.json that onboarding and Add app list. The default is
      # https://catalog.executor.sh/index.json; set it to off without outbound internet access.
      EXECUTOR_CATALOG_URL:
      # This fork uses its own organization registry; EXECUTOR_REGISTRY_URL has no effect.

      # Optional HTTPS app origin base. Localhost derives it from BETTER_AUTH_URL.
      EXECUTOR_APP_UI_BASE_URL:
      # nested (default): <app>.<org>.<base>; flat: <app>--<org>.<base>.
      EXECUTOR_APP_UI_HOST_FORMAT:
      # Optional organization whose apps use <app>.<base>.
      EXECUTOR_APP_UI_DEFAULT_ORGANIZATION:
      # Unset passthrough entries stay absent; the default is bundled Motel.
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_EXPORTER_OTLP_HEADERS:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:
      OTEL_EXPORTER_OTLP_TRACES_HEADERS:
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:
      OTEL_EXPORTER_OTLP_LOGS_HEADERS:
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:
      OTEL_EXPORTER_OTLP_METRICS_HEADERS:
      OTEL_EXPORTER_OTLP_METRICS_PROTOCOL:
      EXECUTOR_BUILD_VERSION:
      EXECUTOR_ENVIRONMENT: ${EXECUTOR_ENVIRONMENT:-self-host}
    init: true
    ports:
      - "127.0.0.1:4400:4400"
    volumes:
      - pglite-data:/app/data
      - motel-data:/app/motel-data
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pglite-data:
  motel-data:
