# Fork CI for shuv1337/executor. The upstream v2 export ships without .github/,
# so nothing gated this fork. Kept in its own file so upstream syncs never touch it.
name: fork-ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # format, lint (deny warnings), typecheck and the repo's structural checks
      - run: bun run check
      # Self-contained e2e suites (no cloud, browser or Docker). ci-selection and
      # export-public are left out: they assume upstream's main-branch CI layout.
      - name: tests
        run: |
          set -euo pipefail
          for suite in pglite typecheck-runner prepare-cache emulator-failures dashboard-file-names release-archives; do
            echo "::group::e2e:$suite"
            bun run "e2e:$suite"
            echo "::endgroup::"
          done

  # Self-host scenarios for scoped-connection widening, OAuth registration and held
  # scopes, app User-Agent, private-registry build egress, load-failure containment,
  # the apps SDK release gate, parked MCP program retention and loss reporting, plus
  # local MCP search. Both jobs use Bun 1.4.4:
  # the collector build and upstream's new-file patches need the newer Bun.
  # No extra secrets: the runner mints its own API key. CI disables the prepare cache.
  security-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      # Upstream CI downloads a separately built collector after prepare; this fork
      # has no such artifact job. Build and qualify the exact pinned crate here.
      - name: Build and verify the Linux x64 telemetry collector
        run: node packages/telemetry/scripts/build-collector.ts --target linux-x64 --install-toolchain build check smoke
      - run: bun run e2e:prepare
      # Filters match scheduled scenario titles from e2e/test-plan.ts, not suite names; the
      # "App dependency registry" suite's only scenario is selected by the private-fetch prefix.
      - name: Security scenarios
        run: |
          bun run e2e:self-host -- --test-name 'application_type|fetch without a User-Agent names Executor|cannot create an all-apps connection|cannot widen a connection or mint|fails to load fails only its own reads|with private fetch off, a build|App dependency registry|keeps renewing grants that hold a scope|own Google client still signs in gmail.modify'
      # A parked program outlives the request that started it: the entry must hold through idle
      # deadlines until its batch finishes, and a crash must report the program lost, not missing.
      - name: Parked MCP program scenarios
        run: |
          bun run e2e:self-host --test-name 'Self-host MCP (resumes all three|reports a crashed parked)|PAT MCP approvals bind|PAT MCP model-mode resume' --workers 1
      # A failed default-app install names its tagged cause in the log, never the registry's URL.
      - name: Provisioning failure scenarios
        run: |
          bun run e2e:self-host --test-name 'Self-host provisioning names the tagged cause' --workers 1
      # The apps SDK release gate is its own suite, not a self-host scenario.
      - name: SDK release gate scenarios
        run: |
          bun run apps:build
          bun run e2e:apps-published -- --testNamePattern 'self-host gate'
      - name: Tool error contract scenarios
        run: bun run e2e:self-host --test-name 'Every error tools/call and tools/run declare|Every error a write reports after its app code received the call'
      - name: Operator feedback scenarios
        run: bun run e2e:self-host --test-name 'self-host feedback webhook|self-host with DO_NOT_TRACK|self-host analytics pseudonymize|Hosted feedback enforces'
      # Run the large cold catalog alone, not beside the functional scenarios' servers.
      - name: Cold MCP discovery
        run: bun run e2e:self-host --test-name 'Cold MCP discovery serves 8549'
      - name: Cold discovery phase timings
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { globSync, readFileSync } from "node:fs";
          for (const file of globSync(".local/e2e/**/telemetry.json")) {
            for (const trace of JSON.parse(readFileSync(file, "utf8"))) {
              const spans = (trace.data ?? []).map(row => row.span).filter(span =>
                /app\.|sdk\.tools|mcp\.|MCP|build.*load|runtime/.test(span.operationName));
              console.log(JSON.stringify({file, id: trace.id, spans: spans.map(s => ({
                phase: s.operationName, ms: s.durationMs, start: s.startTime
              }))}));
            }
          }
          JS
      - name: MCP search scenarios
        run: |
          bun run e2e:local --test-name 'MCP search resolves namespace-relative dotted paths|A broad MCP tool search returns concise pages'
