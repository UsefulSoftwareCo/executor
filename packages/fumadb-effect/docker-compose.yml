# Test databases. Ports mirror upstream fumadb so its connection strings apply.
services:
  postgresql:
    image: postgres:18
    environment:
      POSTGRES_DB: postgresql
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d postgresql"]
      interval: 2s
      timeout: 5s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: test
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppassword"]
      interval: 2s
      timeout: 5s
      retries: 60

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password1234!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"

  cockroachdb:
    image: cockroachdb/cockroach:latest-v25.2
    command: start-single-node --insecure
    environment:
      - COCKROACH_DATABASE=test
      - COCKROACH_USER=root
      - COCKROACH_PASSWORD=password
    ports:
      - "26257:26257"
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "select 1"]
      interval: 2s
      timeout: 5s
      retries: 60
